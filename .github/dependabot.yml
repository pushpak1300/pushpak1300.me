version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: daily
      time: "00:00"
    open-pull-requests-limit: 10
    reviewers:
      - pushpak1300
    assignees:
      - pushpak1300
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
  - package-ecosystem: github-actions
    directory: "/"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    schedule:
      interval: daily
      time: "00:00"
    open-pull-requests-limit: 10
    reviewers:
      - pushpak1300
    assignees:
      - pushpak1300
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
